<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://smypdolihotxtdlbgqua.supabase.co https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iwi2me</title>
  <meta name="theme-color" content="#130A33">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPhone : permet l'installation sur l'écran d'accueil en plein écran -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iwi2me">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- Bandeau photo animé (hors de #view pour que l'animation ne redémarre pas à chaque clic) -->
    <section class="hero" id="hero" aria-label="Illustration iwi2me, painting session">
      <div class="hero-media" id="heroMedia"><img src="img/scene.svg" alt="Illustration anime : pique-nique de nuit au bord de l'eau, iwi2me painting session" decoding="async"></div>
      <!-- Zones cliquables posées sur Nelson (milieu, au fond) et Sophie (à droite) -->
      <button class="spot" id="spotNelson" data-id="nelson" aria-label="Ouvrir le calendrier de Nelson"><span class="tag">Nelson</span></button>
      <button class="spot" id="spotSophie" data-id="sophie" aria-label="Ouvrir le calendrier de Sophie"><span class="tag">Sophie</span></button>
      <button class="chip-glass zoom" data-act="zoom" aria-label="Voir l'illustration en grand">⤢</button>
    </section>
    <div id="view"></div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="cal" class="tab">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span>Calendrier</span>
    </button>
    <button data-tab="tasks" class="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>
      <span>Tâches</span>
    </button>
    <button data-tab="sport" class="tab">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      <span>Sport</span>
    </button>
    <button data-tab="astro" class="tab">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><path d="m17 3 .7 1.8L19.5 5.5l-1.8.7L17 8l-.7-1.8-1.8-.7 1.8-.7Z"/></svg>
      <span>Astro</span>
    </button>
    <button data-tab="settings" class="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <!-- Feuille de saisie (ajout d'événement ou de tâche) -->
  <dialog id="photo"><img src="img/scene.svg" alt="Illustration iwi2me, painting session"></dialog>
  <dialog id="sheet"><form method="dialog" id="sheetForm"></form></dialog>

  <script src="config.js"></script>
  <script src="astro.js"></script>
  <script src="app.js"></script>
</body>
</html>
